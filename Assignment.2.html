<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Semantic and Non Semantic Examples</title>
</head>
<body>
    <!-- Semantic Example -->
     <header>
        <h1>Basic HTML Page</h1>
     
        </header>
        <article>
        <h2>About Semantic HTML Elements</h2>
        <p>Semantic elements like header and article describe their meaning clearly</p>
        </article>
    <!-- Non Semantic Example -->
    <div style="background-color: lightblue;"padding="10">
        <h3>This is inside a div </h3>
        <p> A div is just a container without meaning. It ia a Non- Semantic element.</p></div>
        <span style="color: rgb(red, green, blue);"This is inside a span. This is Non- Semantic element.</span>
            
</body>
</html>
